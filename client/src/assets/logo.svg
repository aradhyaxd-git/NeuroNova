<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Primary Purple/Magenta Gradient -->
    <linearGradient id="neuronova-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC46F0" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Node -->
  <rect x="25" y="25" width="150" height="150" rx="42" fill="url(#neuronova-grad)" filter="url(#glow)" />

  <!-- Neural Orbital Rings -->
  <circle cx="100" cy="100" r="54" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="100" cy="100" r="38" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.6" />

  <!-- Center Quantum Core Spark -->
  <path d="M100 65 L108 92 L135 100 L108 108 L100 135 L92 108 L65 100 L92 92 Z" fill="#FFFFFF" />

  <!-- Satellite Neural Nodes -->
  <circle cx="100" cy="46" r="7" fill="#FFFFFF" />
  <circle cx="154" cy="100" r="7" fill="#FFFFFF" />
  <circle cx="100" cy="154" r="7" fill="#FFFFFF" />
  <circle cx="46" cy="100" r="7" fill="#FFFFFF" />
</svg>
